<!doctype html>
<!--
  Kwetu client bootstrap page (Phase-1 Part B shell).
  Full-viewport canvas only — no UI text tonight, so no i18n surface.
  The script path is RELATIVE so the same page serves from the dev server
  (repo root, at /client/index.html) and from the production build
  (vite --root client, where index.html is the build entry).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kwetu</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="kwetu-canvas"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
