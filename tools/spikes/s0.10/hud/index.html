<!doctype html>
<!-- S0.10 HUD probe page — throwaway Phase-0 spike (tools/spikes carve-out). -->
<!-- Served from the repo root by tools/spikes/s0.10/measure.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>S0.10 HUD probe</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; color: #d8e2ea;
               font: 12px/14px system-ui, "Segoe UI", sans-serif; }
  #gl  { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr);
         gap: 0 10px; padding: 6px 10px; pointer-events: none; box-sizing: border-box; }
  #hud .stat { white-space: nowrap; height: 14px; overflow: hidden; }
  #hud .stat .l { color: #7d8b98; }
  #hud .stat .v { color: #e6edf3; }
  #c2d { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .off { display: none !important; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="off"></div>
<canvas id="c2d" class="off"></canvas>
<script type="module" src="/tools/spikes/s0.10/hud/probe.js"></script>
</body>
</html>
